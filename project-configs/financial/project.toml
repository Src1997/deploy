# project-configs/financial/project.toml — 金融项目（v2 意图模型）
#
# 包含：行情/社区前端 + 管理后台 + FastAPI 后端
# 新增项目只需复制本文件并修改，无需改动任何脚本。
#
# ★v2 意图模型：TOML 只声明 routes/process/companions。
#   financial-api 走 legacy deploy_hook（scripts/deploy-python.sh）——
#   hook 负责代码+依赖+迁移，服务操作仍由通道动词接管（迁移完成后退役 hook）。

[project]
id = "financial"
display_name = "金融项目（行情/社区前端 + 管理后台 + API）"

# ── 关键文件：随包上传的部署资产（native 通道 systemd 单元模板）──
key_files = [
    "assets/systemd/financial-api.service",
    "assets/systemd/financial-crawler.service",
    "assets/systemd/financial-worker.service",
    "assets/systemd/financial-streaming.service",
]

[deploy]
backup_retention = 5
health_timeout = 30

# 行情/社区前端（根站点）
[[components]]
id = "financial-web"
kind = "frontend"
display_name = "行情/社区前端"
source_path = "financial/financial-web"
public_url = "/"
deploy_path = "financial/financial-web/dist"
routes = [
    { path = "/", type = "root", spa = true },
]

  [components.build]
  package_manager = "pnpm"
  build_script = "build"
  dist_dir = "dist"
  artifact = "financial-web-dist.tar.gz"

# 管理后台
[[components]]
id = "financial-admin"
kind = "frontend"
display_name = "管理后台"
source_path = "financial/financial-admin"
public_url = "/admin/"
deploy_path = "financial/financial-admin/dist"
routes = [
    { path = "/admin/", type = "static", spa = true },
]

  [components.build]
  package_manager = "pnpm"
  build_script = "build"
  dist_dir = "dist"
  artifact = "financial-admin-dist.tar.gz"

# FastAPI 后端 (Python)
[[components]]
id = "financial-api"
kind = "python"
display_name = "FastAPI 后端"
source_path = "financial/financial-api"
deploy_path = "financial/financial-api/package"
health_url = "http://127.0.0.1:5001/api/health"
deploy_hook = "scripts/deploy-python.sh"    # legacy：迁移完成后退役
post_deploy_check_path = "/api/navigation/menu"
web_path = "/financial"
routes = [
    { path = "/api/ws", type = "websocket", target = "http://127.0.0.1:5001/api/ws" },
    { path = "/api/",   type = "proxy",     target = "http://127.0.0.1:5001/api/" },
]
# 主进程意图（2026-10-22 面板接管：宝塔=Python 项目 / docker=容器）
[components.process]
port = 5001
cmd = ".venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 5001 --no-access-log"
migrate = "alembic upgrade head"

# 伴随服务（宝塔=supervisor / 原生=systemd 单元；主进程已由 process 接管）
companions = [
    "financial-crawler",
    "financial-worker",
    "financial-streaming",
]

  # ── 打包文件配置：只打包服务器需要的 ──
  # include_env ★ 安全：仅此处列出的 .env 才允许进包，默认全排除。
  [components.pack]
  package_mode = "app-package"
  artifact_pattern = "financial-api-*.tar.gz"
  include_files = [
      "scripts/deploy-python.sh",
      "assets/financial-api.env.example",
  ]
  include_env = ["assets/financial-api.env"]
