# ═══════════════════════════════════════════════════════════════
# financial 项目 — 克隆业务数据表清单（07-clone-source-data.sh 用）
# 格式:  <组名>: <库> <表1> <表2> ...
# 库 = quant_zc(financial域) | quantdinger(deepquant域)
# 注意: full 是显式全量清单（含 core 全部表），不是叠加
# ═══════════════════════════════════════════════════════════════

# core —— 运营配置/账号/导航（新机上线通常只搬这组）
# ★ fin_mt5_* 不在清单：它们已改为 postgres_fdw 外部表直读 B（见 multi-server-interconnect.md），
#   克隆会对 FDW 表 TRUNCATE/INSERT = 直接操作 B 的真数据，严禁！
core: quant_zc fin_navigation_nodes fin_app_configs fin_users fin_mega_menus fin_mega_menu_categories fin_mega_menu_links fin_footer_columns fin_footer_links fin_external_links fin_data_source_configs fin_signal_configs fin_search_hot_keywords fin_news_keywords fin_home_feed_widgets
core: quantdinger qd_users

# full —— 显式全量（core 全部 + 内容历史大表：行情/日历/新闻，源站数据量大时较慢）
full: quant_zc fin_navigation_nodes fin_app_configs fin_users fin_mega_menus fin_mega_menu_categories fin_mega_menu_links fin_footer_columns fin_footer_links fin_external_links fin_data_source_configs fin_signal_configs fin_search_hot_keywords fin_news_keywords fin_home_feed_widgets fin_calendar_events fin_news_items
full: quantdinger qd_users

# ── post-override：克隆完成后必须在目标机重放的机器级差异（架构：MT5/行情数据取值 B）──
# A/C 的 fin_mt5_* 数据均为 B 的静态快照（A 无增量同步 cron，C 与 A 对齐）；
# 品牌差异（C=卓筹/ZC logo）在每次 clone 后会被源站值覆盖，必须重放。
post-override: UPDATE fin_app_configs SET config_value='"卓筹商学院"'::jsonb WHERE "namespace"='brand' AND config_key='name';
post-override: UPDATE fin_app_configs SET config_value='"/logos/ZC1.png"'::jsonb WHERE "namespace"='brand' AND config_key IN ('logo_url','loading_logo_url');
post-override: UPDATE fin_app_configs SET config_value='"/logos/ZC3.png"'::jsonb WHERE "namespace"='brand' AND config_key='footer_logo_url';
