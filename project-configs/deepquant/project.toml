# project-configs/deepquant/project.toml — QuantDinger 项目（v2 意图模型）
#
# 包含：前端 + 后端（后端包内已携带 MCP Server 源码）
# 后端 source-tar 模式（源码在归档根），MCP 由 extra_source 搭车（mcp_server/）。
#
# ★历史事故备忘（2026-08-24）：deepquant-mcp 曾作为独立组件与 backend 共用
#   deploy_path，后部署方清空覆盖先部署方（backend 无限崩溃重启）。
#   规则：同一 deploy_path 禁止两个组件共用；MCP 由 backend 组件携带。
#
# ★v2 意图模型：TOML 只声明 routes/process/companions，通道字眼绝迹——
#   宝塔通道把 process 翻译成宝塔 Python 项目（名=组件 id）、companions
#   翻译成 supervisor 程序、routes 翻译成面板原生反代。

[project]
id = "deepquant"
display_name = "QuantDinger 项目（前端 + 后端 + MCP）"

# ── 关键文件：随包上传的部署资产（native 通道 systemd 单元模板）──
key_files = [
    "assets/systemd/deepquant-backend.service",
    "assets/systemd/quantdinger-mcp.service",
]

[deploy]
backup_retention = 5
health_timeout = 30

# ── 组件 ──

# QuantDinger 前端
[[components]]
id = "deepquant-web"
kind = "frontend"
display_name = "QuantDinger 前端"
source_path = "deepquant/deepquant_vue"
public_url = "/quant/"
deploy_path = "deepquant/web/dist"
routes = [
    { path = "/quant/", type = "static", spa = true },
]

  [components.build]
  package_manager = "pnpm"
  build_script = "build"
  dist_dir = "dist"
  artifact = "deepquant-web-dist.tar.gz"

# QuantDinger 后端 (Python，含 MCP)
[[components]]
id = "deepquant-backend"
kind = "python"
display_name = "QuantDinger 后端"
source_path = "deepquant/deepquant/backend_api_python"
deploy_path = "deepquant/backend/package"
health_url = "http://127.0.0.1:5000/api/health"
routes = [
    { path = "/quant/api/", type = "proxy",     target = "http://127.0.0.1:5000/api/" },
    { path = "/quant/ws/",  type = "websocket", target = "http://127.0.0.1:5000/ws/" },
]
# 伴随服务（★必须写在 [components.process] 段之前）
# 纯名字 = 宝塔 supervisor / 原生 systemd 单元；对象形式补充 docker 容器化所需意图
companions = [
    { name = "quantdinger-mcp", cmd = "python -m quantdinger_mcp.server", port = 7800 },
]
# 主进程：端口 + 启动命令（相对 deploy_path；通道负责拼绝对路径）
[components.process]
port = 5000
cmd = ".venv/bin/gunicorn -c gunicorn_config.py run:app"

  [components.pack]
  package_mode = "source-tar"
  artifact_pattern = "deepquant-backend-*.tar.gz"
  include_files = [
      "assets/deepquant.env.example",
  ]
  # ★ 显式允许真实 .env 进包
  include_env = ["assets/deepquant.env"]
  # 附带额外源码目录（MCP 服务），复制到归档根下指定子目录
  [[components.pack.extra_source]]
  path = "deepquant/deepquant/mcp_server"
  dest = "mcp_server"
