# project-configs/fullstack-demo/project.toml — 全栈示例配置
#
# 演示如何配置一个包含全部 5 种 kind 的全栈项目：
#   - React 前端 (npm)
#   - Java 后端 (Maven / Spring Boot)
#   - Go 后端 (Gin)
#   - Node.js 后端 (NestJS)
#
# 复制此目录并修改路径/名称即可接入新项目。
# 实际项目中通常只会用到 2-3 种，不需要全部使用。

[project]
id = "fullstack-demo"
display_name = "全栈示例项目（React + Java + Go + Node.js）"

# ── 关键文件：随包上传的部署资产 ──
key_files = [
    "configs/systemd/fullstack-demo.service",
]

# ── 关键配置 ──
[deploy]
backup_retention = 5
health_timeout = 30

# ── 组件 ──

# ━━ React 前端（npm）━━
[[components]]
id = "demo-react-web"
kind = "frontend"
display_name = "React 前端 (npm)"
source_path = "fullstack-demo/frontend"
public_url = "/"
deploy_path = "fullstack-demo/web/dist"
nginx_reload = true

  [components.build]
  package_manager = "npm"          # 支持 pnpm / npm / yarn
  build_script = "run build"       # npm run build
  dist_dir = "build"               # CRA 默认 build/，Vite 用 dist/
  artifact = "demo-react-web-dist.tar.gz"

  [[components.nginx.locations]]
  path = "/"
  type = "static"
  spa_fallback = true

# ━━ Java 后端（Maven / Spring Boot）━━
[[components]]
id = "demo-java-api"
kind = "java"
display_name = "Java API (Maven)"
source_path = "fullstack-demo/java-backend"
deploy_path = "fullstack-demo/java-api"
nginx_reload = false
health_url = "http://127.0.0.1:8080/actuator/health"
services = ["fullstack-demo-java"]

  [[components.nginx.locations]]
  path = "/java-api/"
  type = "proxy"
  proxy_target = "http://127.0.0.1:8080"
  proxy_path = "/api/"

  # Maven: mvn clean package -DskipTests → target/*.jar
  # Gradle: gradle build -x test → build/libs/*.jar
  [components.build]
  build_tool = "maven"             # maven | gradle
  jar_dir = "target"               # Maven: target, Gradle: build/libs
  jar_pattern = "demo-api-*.jar"   # 精确匹配（可选，留空则自动检测最新）
  artifact_pattern = "demo-java-api-*.tar.gz"
  include_files = ["configs/fullstack-demo-java.env.example"]
  # ★ 显式允许真实 .env 进包（安全白名单）
  include_env = ["configs/fullstack-demo-java.env"]

# ━━ Go 后端（Gin）━━
[[components]]
id = "demo-go-api"
kind = "go"
display_name = "Go API (Gin)"
source_path = "fullstack-demo/go-backend"
deploy_path = "fullstack-demo/go-api"
nginx_reload = false
health_url = "http://127.0.0.1:8081/health"
services = ["fullstack-demo-go"]

  [[components.nginx.locations]]
  path = "/go-api/"
  type = "proxy"
  proxy_target = "http://127.0.0.1:8081"
  proxy_path = "/api/"

  [components.build]
  # 交叉编译为 Linux 二进制（在 Windows 上构建部署到 Linux 服务器）
  build_command = "$env:GOOS='linux'; $env:GOARCH='amd64'; go build -o demo-go-api ./cmd/server"
  binary_name = "demo-go-api"      # 二进制文件名（可选，留空则自动检测）
  # binary_dir = "bin"             # 二进制输出目录（可选，默认源码根）
  artifact_pattern = "demo-go-api-*.tar.gz"
  include_files = ["configs/fullstack-demo-go.env.example"]
  include_env = ["configs/fullstack-demo-go.env"]

# ━━ Node.js 后端（NestJS）━━
[[components]]
id = "demo-nodejs-api"
kind = "nodejs"
display_name = "Node.js API (NestJS)"
source_path = "fullstack-demo/nodejs-backend"
deploy_path = "fullstack-demo/nodejs-api"
nginx_reload = false
health_url = "http://127.0.0.1:8082/health"
services = ["fullstack-demo-nodejs"]

  [[components.nginx.locations]]
  path = "/node-api/"
  type = "proxy"
  proxy_target = "http://127.0.0.1:8082"
  proxy_path = "/api/"

  # ── Node.js 打包配置 ──
  # 可选 build_script：NestJS 需要 tsc 编译 TS → JS
  # 不配 build_script 则跳过构建步骤（纯 JS 项目如 Express）
  [components.build]
  package_manager = "npm"          # pnpm / npm / yarn
  build_script = "run build"       # npm run build (NestJS → dist/)
  artifact_pattern = "demo-nodejs-api-*.tar.gz"

  # 排除列表使用 [nodejs_defaults]（_shared.toml），可在此追加
  [components.pack]
  extra_exclude_dirs = [".nestjs"]
  include_files = ["configs/fullstack-demo-nodejs.env.example"]
  include_env = ["configs/fullstack-demo-nodejs.env"]
