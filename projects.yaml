# deploy/projects.yaml — 项目清单（SSOT，人类编辑源）
# 修改后运行: python3 scripts/sync-projects.py 生成 projects.json
version: 1

# 本地源码根：空则 = deploy 父目录；可被环境变量 WORKSPACE_ROOT 覆盖
workspaceRoot: ""

# 服务器项目根：可被 deploy.env 的 PROJECT_BASE 覆盖
projectBase: /www/wwwroot/project

projects:
  - id: financial-web
    enabled: true
    kind: frontend
    displayName: 行情/社区前端
    sourcePath: financial/financial-web
    publicUrl: /
    build:
      packageManager: pnpm
      script: build
      distDir: dist
      artifact: financial-web-dist.tar.gz
    deployPath: financial/financial-web/dist
    services: []
    healthUrl: ""
    nginxReload: true
    nginx:
      rootProject: true

  - id: financial-api
    enabled: true
    kind: backend
    displayName: FastAPI 后端
    sourcePath: financial/financial-api
    build:
      packer: scripts/pack-generic.ps1
      # 非 source-tar：源码进 package/；include 保留 scripts/、configs/ 相对路径（不拍扁）
      artifactPattern: financial-api-*.tar.gz
      include:
        - scripts/deploy-financial-api.sh
        - configs/systemd/financial-api.service
        - configs/systemd/financial-crawler.service
        - configs/systemd/financial-worker.service
        - configs/systemd/financial-streaming.service
        - configs/financial-api.env.example
    deployPath: financial/financial-api/package
    services:
      - financial-api
      - financial-crawler
      - financial-worker
      - financial-streaming
    healthUrl: http://127.0.0.1:5001/api/health
    nginxReload: false
    deployHook: scripts/deploy-financial-api.sh
    nginx:
      locations:
        - path: /api/ws
          type: websocket
          proxyTarget: http://127.0.0.1:5001
          proxyPath: /api/ws
        - path: /api/
          type: proxy
          proxyTarget: http://127.0.0.1:5001
          proxyPath: /api/

  - id: financial-admin
    enabled: true
    kind: frontend
    displayName: 管理后台
    sourcePath: financial/financial-admin
    publicUrl: /admin/
    build:
      packageManager: pnpm
      script: build
      distDir: dist
      artifact: financial-admin-dist.tar.gz
    deployPath: financial/financial-admin/dist
    services: []
    healthUrl: ""
    nginxReload: true
    nginx:
      locations:
        - path: /admin/
          type: static
          spaFallback: true

  - id: official-site
    enabled: true
    kind: frontend
    displayName: 卓筹介绍站
    sourcePath: official-site
    publicUrl: /qd/
    build:
      packageManager: pnpm
      script: build
      distDir: dist
      artifact: official-site-dist.tar.gz
      envFile: configs/official-site.env
    deployPath: official-site/dist
    services: []
    healthUrl: ""
    nginxReload: true
    nginx:
      locations:
        - path: /qd/
          type: static
          spaFallback: true

  - id: deepquant-web
    enabled: true
    kind: frontend
    displayName: QuantDinger 前端
    sourcePath: deepquant/deepquant_vue
    publicUrl: /quant/
    build:
      packageManager: pnpm
      script: build
      distDir: dist
      artifact: deepquant-web-dist.tar.gz
    deployPath: deepquant/web/dist
    services: []
    healthUrl: ""
    nginxReload: true
    nginx:
      locations:
        - path: /quant/
          type: static
          spaFallback: true

  - id: deepquant-backend
    enabled: true
    kind: backend
    displayName: QuantDinger 后端
    sourcePath: deepquant/deepquant/backend_api_python
    build:
      mode: source-tar
      artifact: deepquant-backend-package.tar.gz
      exclude:
        - .env
        - .venv
        - venv
        - logs
        - __pycache__
        - .git
    deployPath: deepquant/backend/package
    services:
      - quantdinger-backend
    healthUrl: http://127.0.0.1:5000/api/health
    nginxReload: false
    nginx:
      locations:
        - path: /quant/api/
          type: proxy
          proxyTarget: http://127.0.0.1:5000
          proxyPath: /api/
        - path: /ws/
          type: websocket
          proxyTarget: http://127.0.0.1:5000
          proxyPath: /ws/

# 基础设施级 Nginx location（不绑定特定项目，如 MCP Server）
nginxExtras:
  - path: /mcp
    type: proxy
    proxyTarget: http://127.0.0.1:7800
    proxyPath: /mcp
    specialHeaders: true
