# ═══════════════════════════════════════════════════════════════
# 宝塔 Nginx 统一站点配置（带 SSL）
#
# 路由表与 nginx-all-sites.conf 完全一致，仅增加 SSL 配置
# 服务器 B (103.100.211.12) 使用此配置
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name _;

    # ── SSL 证书 ──
    ssl_certificate    /www/server/panel/vhost/cert/www.deepquant.club/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/www.deepquant.club/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    # HTTP → HTTPS 自动跳转（仅域名访问时生效，IP 访问不走 SSL）
    error_page 497  https://$host$request_uri;

    # ── SSL 证书验证目录 ──
    include /www/server/panel/vhost/nginx/well-known/www.deepquant.club.conf;

    # ── Gzip 压缩 ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        text/javascript
        image/svg+xml;

    # ── 安全头 ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── 请求体大小限制 ──
    client_max_body_size 20m;

    # ── 默认 MIME 类型 ──
    include mime.types;
    default_type application/octet-stream;

    # ═══════════════════════════════════════════════════════════
    # financial-api WebSocket 反向代理（/api/ws）
    # ═══════════════════════════════════════════════════════════
    location ^~ /api/ws {
        proxy_pass http://127.0.0.1:5001/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ═══════════════════════════════════════════════════════════
    # financial-api HTTP 反向代理（/api/）
    # ═══════════════════════════════════════════════════════════
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ═══════════════════════════════════════════════════════════
    # QuantDinger 后端 API 反向代理（/quant/api/）
    # ═══════════════════════════════════════════════════════════
    location ^~ /quant/api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 10m;
    }

    # ═══════════════════════════════════════════════════════════
    # QuantDinger WebSocket（/ws/）
    # ═══════════════════════════════════════════════════════════
    location ^~ /ws/ {
        proxy_pass http://127.0.0.1:5000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ═══════════════════════════════════════════════════════════
    # MCP Server（/mcp）
    # ═══════════════════════════════════════════════════════════
    location ^~ /mcp {
        proxy_pass http://127.0.0.1:7800/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:7800;
        proxy_set_header Connection "";
        proxy_set_header Content-Type $content_type;
        proxy_set_header Accept $http_accept;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ═══════════════════════════════════════════════════════════
    # official-site 静态站点（/qd/）
    # ═══════════════════════════════════════════════════════════
    # 无尾部斜杠时 301 重定向，避免落入 SPA fallback
    location = /qd { return 301 /qd/; }
    location ^~ /qd/ {
        alias /www/wwwroot/project/official-site/dist/;
        index index.html;
        try_files $uri $uri/ /qd/index.html;
    }

    location = /qd/index.html {
        alias /www/wwwroot/project/official-site/dist/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ═══════════════════════════════════════════════════════════
    # QuantDinger 前端静态站点（/quant/）
    # ═══════════════════════════════════════════════════════════
    # 无尾部斜杠时 301 重定向，避免落入 SPA fallback
    location = /quant { return 301 /quant/; }
    location ^~ /quant/ {
        alias /www/wwwroot/project/deepquant/web/dist/;
        index index.html;
        try_files $uri $uri/ /quant/index.html;
    }

    location = /quant/index.html {
        alias /www/wwwroot/project/deepquant/web/dist/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ═══════════════════════════════════════════════════════════
    # financial-web 静态站点（根路径 /）
    # ═══════════════════════════════════════════════════════════
    root /www/wwwroot/project/financial/financial-web/dist;
    index index.html;

    location = /index.html {
        root /www/wwwroot/project/financial/financial-web/dist;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 健康检查 ──
    location = /health {
        return 200 'OK';
        add_header Content-Type text/plain;
        access_log off;
    }

    # ── 日志 ──
    access_log /www/wwwlogs/access.log;
    error_log /www/wwwlogs/error.log;
}
