# ═══════════════════════════════════════════════════════════════
# 宝塔 Nginx 统一站点配置
#
# 使用方法：
#   1. 宝塔面板 → 网站 → 添加站点（域名填服务器 IP 或 _）
#   2. 站点设置 → 配置文件 → 全部替换为以下内容
#   3. 保存后执行 nginx -t 检查，nginx -s reload 重载
#
# 路由表：
#   /              → financial-web (静态 SPA)
#   /qd/           → official-site (静态 SPA)
#   /api/ws        → financial-api :5001 (WebSocket)
#   /api/          → financial-api :5001 (HTTP API)
#   /quant/api/    → QuantDinger :5000 (HTTP API)
#   /quant/        → QuantDinger 前端 (静态 SPA)
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    # 使用 IP 访问时填 IP 或 _；有域名后改为域名如 www.example.com
    server_name _;

    # ── Gzip 压缩 ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        text/javascript
        image/svg+xml;

    # ── 安全头 ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── 请求体大小限制 ──
    client_max_body_size 20m;

    # ── 默认 MIME 类型 ──
    include mime.types;
    default_type application/octet-stream;

    # ═══════════════════════════════════════════════════════════
    # financial-api WebSocket 反向代理（/api/ws）
    # 必须放在 /api/ 之前，Nginx 按最长前缀匹配
    # ═══════════════════════════════════════════════════════════
    location ^~ /api/ws {
        proxy_pass http://127.0.0.1:5001/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接保活
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ═══════════════════════════════════════════════════════════
    # financial-api HTTP 反向代理（/api/）
    # ═══════════════════════════════════════════════════════════
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ═══════════════════════════════════════════════════════════
    # QuantDinger 后端 API 反向代理（/quant/api/）
    # /quant/api/users → http://127.0.0.1:5000/api/users
    # ═══════════════════════════════════════════════════════════
    location ^~ /quant/api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 10m;
    }

    # ═══════════════════════════════════════════════════════════
    # official-site 静态站点（/qd/）
    # ═══════════════════════════════════════════════════════════
    # 无尾部斜杠时 301 重定向，避免落入 SPA fallback
    location = /qd { return 301 /qd/; }
    location ^~ /qd/ {
        alias /www/wwwroot/project/official-site/dist/;
        index index.html;
        try_files $uri $uri/ /qd/index.html;

        # SPA fallback 时也要返回正确的 Content-Type
        # Nginx 会根据文件扩展名自动设置 MIME 类型
    }

    # official-site index.html 禁止缓存
    location = /qd/index.html {
        alias /www/wwwroot/project/official-site/dist/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ═══════════════════════════════════════════════════════════
    # QuantDinger 前端静态站点（/quant/）
    # base: /quant/，使用 hash 路由（/#/route）
    # ═══════════════════════════════════════════════════════════
    # 无尾部斜杠时 301 重定向，避免落入 SPA fallback
    location = /quant { return 301 /quant/; }
    location ^~ /quant/ {
        alias /www/wwwroot/project/deepquant/web/dist/;
        index index.html;
        try_files $uri $uri/ /quant/index.html;
    }

    # QuantDinger index.html 禁止缓存
    location = /quant/index.html {
        alias /www/wwwroot/project/deepquant/web/dist/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ═══════════════════════════════════════════════════════════
    # financial-web 静态站点（根路径 /）
    # 必须放在最后，作为 fallback
    # ═══════════════════════════════════════════════════════════
    root /www/wwwroot/project/financial/financial-web/dist;
    index index.html;

    # financial-web index.html 禁止缓存
    location = /index.html {
        root /www/wwwroot/project/financial/financial-web/dist;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # SPA fallback：所有未匹配的路径返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 健康检查端点 ──
    location = /health {
        return 200 'OK';
        add_header Content-Type text/plain;
        access_log off;
    }

    # ── 日志 ──
    access_log /www/wwwlogs/access.log;
    error_log /www/wwwlogs/error.log;
}

# ═══════════════════════════════════════════════════════════════
# SSL 配置（域名准备好后取消注释并修改）
#
# 1. 宝塔面板 → SSL → Let's Encrypt 申请证书
# 2. 将以下 server 块取消注释
# 3. 修改 server_name 为实际域名
# 4. 修改 ssl_certificate 路径为宝塔生成的证书路径
# ═══════════════════════════════════════════════════════════════
#
# server {
#     listen 80;
#     server_name www.example.com;
#     # HTTP → HTTPS 重定向
#     return 301 https://$host$request_uri;
# }
#
# server {
#     listen 443 ssl http2;
#     server_name www.example.com;
#
#     ssl_certificate /www/server/panel/vhost/cert/www.example.com/fullchain.pem;
#     ssl_certificate_key /www/server/panel/vhost/cert/www.example.com/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers HIGH:!aNULL:!MD5;
#     ssl_prefer_server_ciphers on;
#
#     # ... 以下与上面 80 端口的 location 配置完全相同 ...
# }
