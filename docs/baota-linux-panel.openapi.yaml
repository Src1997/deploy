                      type: integer
                      example: 1
                    path:
                      type: string
                      example: /www/wwwroot/w1.if22.cn
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pass:
                    type: boolean
                    description: 是否设置密码访问
                  logs:
                    type: boolean
                    description: 是否写访问日志
                  userini:
                    type: boolean
                    description: 是否设置防跨站
                  runPath:
                    type: object
                    properties:
                      dirs:
