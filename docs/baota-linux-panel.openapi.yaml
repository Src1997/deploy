  /site?action=GetIndex:
    post:
      tags: [网站]
      summary: 取默认文档信息
      operationId: siteGetIndex
      parameters:
        - $ref: "#/components/parameters/AuthQueryTime"
        - $ref: "#/components/parameters/AuthQueryToken"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              allOf:
                - $ref: "#/components/schemas/AuthOnly"
                - type: object
                  required: [id]
                  properties:
                    id:
                      type: integer
                      example: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
                example: index.php,index.html,index.htm,default.php,default.htm,default.html

  /site?action=SetIndex:
    post:
      tags: [网站]
      summary: 设置默认文档
      operationId: siteSetIndex
      parameters:
        - $ref: "#/components/parameters/AuthQueryTime"
        - $ref: "#/components/parameters/AuthQueryToken"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              allOf:
                - $ref: "#/components/schemas/AuthOnly"
                - type: object
                  required: [id, Index]
                  properties:
                    id:
                      type: integer
                      example: 1
                    Index:
                      type: string
                      description: 默认文档，逗号分隔（参数名大写 I）
                      example: index.php,index.html,index.htm,default.php,default.htm,default.html
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMsg"

components:
  parameters:
    AuthQueryTime:
      name: request_time
      in: query
      required: false
      schema:
        type: string
        example: "{{request_time}}"
      description: 也可放在 form body；建议用前置脚本写入环境变量
    AuthQueryToken:
      name: request_token
      in: query
      required: false
      schema:
        type: string
        example: "{{request_token}}"
      description: md5(request_time + md5(apiSk))

  schemas:
    AuthOnly:
      type: object
      required: [request_time, request_token]
      properties:
        request_time:
          type: string
          description: 当前 Unix 时间戳（秒）
          example: "{{request_time}}"
        request_token:
          type: string
          description: md5(request_time + md5(apiSk))
          example: "{{request_token}}"

    StatusMsg:
      type: object
      properties:
        status:
          type: boolean
        msg:
          type: string

    SystemTotal:
      type: object
      properties:
        system:
          type: string
        version:
          type: string
        time:
          type: string
        cpuNum:
          type: integer
        cpuRealUsed:
          type: number
        memTotal:
          type: integer
        memRealUsed:
          type: integer
        memFree:
          type: integer
        memCached:
          type: integer
        memBuffers:
          type: integer
        isuser:
          type: integer

    DiskInfoItem:
      type: object
      properties:
        path:
          type: string
        inodes:
          type: array
          items:
            type: string
          description: "[总量,已使用,可用,使用率]"
        size:
          type: array
          items:
            type: string
          description: "[总量,已使用,可用,使用率]"

    NetWorkInfo:
      type: object
      properties:
        downTotal:
          type: integer
        upTotal:
          type: integer
        downPackets:
          type: integer
        upPackets:
          type: integer
        down:
          type: number
        up:
          type: number
        cpu:
          type: array
          items: {}
          description: "[使用率, 核心数]"
        mem:
          type: object
          additionalProperties: true
        load:
          type: object
          additionalProperties: true

    PagedData:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        page:
          type: string
        where:
          type: string
